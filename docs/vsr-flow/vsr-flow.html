s="0;0.712775;0.716408;1" values="none;inline;none;none"/><g transform="translate(399,384)"><rect x="-51.67" y="-68" width="158.18" height="32" rx="8" class="mk"/><text x="27.41" y="-46" class="b c s20 on">✕ R0 DOWN</text></g></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.822641;0.826274;1" values="none;inline;none;none"/><g transform="translate(399,556.8)"><rect x="51.56" y="-79" width="106.41" height="32" rx="8" class="mk"/><text x="104.77" y="-57" class="b c s20 on">✕ LOST</text></g></g><rect x="16" y="1352" width="1424" height="178" rx="12" class="pn"/><g><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.022129;0.04789;0.10668;0.141359;0.219057;0.23491;0.303361;0.316902;0.353233;0.382958;0.419536;0.451243;1" values="inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;inline"/><rect x="1312" y="1362" width="112" height="30" rx="7" class="chF"/><text x="1368" y="1384" class="b c">FUTURE</text></g><g><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.066386;0.10668;0.154901;0.19825;0.251755;0.285856;0.316902;0.341012;0.396499;0.419536;0.45983;0.598216;0.634877;0.655024;0.665263;0.692016;0.70952;0.76798;0.797044;0.806127;0.819668;0.839815;0.864586;0.884733;0.90554;0.982495;1" values="inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;none;inline;inline"/><rect x="1206" y="1362" width="96" height="30" rx="7" class="chT"/><text x="1254" y="1384" class="b c on">TODAY</text></g><g><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.022129;1" values="inline;none;none"/><text x="36" y="1388" class="b s22">Step 1 (A0): Start: three replicas in view 0</text><text x="1432" y="38" class="e s24">step 1 of 70</text><text x="36" y="1424" class="s20">R0 is the primary because 0 mod 3 = 0. alice and bob are logged on at the R0 gateway, and each got LogonAck seq 1. Every engine has</text><text x="36" y="1450" class="s20">last_applied_op 0, client table {alice: 0, bob: 0}, and an empty book. Today mex runs one replica without VSR. This picture shows the</text><text x="36" y="1476" class="s20">three replicas that VSR will add.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.022129;0.034349;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 2 (A1): alice sends NewOrder to the R0 gateway</text><text x="1432" y="38" class="e s24">step 2 of 70</text><text x="36" y="1424" class="s20">alice sends NewOrder with request_number 1 to the R0 gateway. The order sells 10 of symbol 1 at price 100. Only the gateway of the</text><text x="36" y="1450" class="s20">primary accepts clients.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.034349;0.04789;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 3 (A2): The gateway validates and routes</text><text x="1432" y="38" class="e s24">step 3 of 70</text><text x="36" y="1424" class="s20">The gateway checks the request before the log: logged on, known symbol, qty &gt; 0, price in band. All checks pass. The shared</text><text x="36" y="1450" class="s20">configuration routes symbol 1 to engine 0, slot 0.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.04789;0.066386;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 4 (A3): R0 gives the request op-number 1</text><text x="1432" y="38" class="e s24">step 4 of 70</text><text x="36" y="1424" class="s20">R0 sets n from 0 to 1. It builds Command{op_number 1, session_id 0, symbol_slot 0, order} and appends it to log[1]. The entry is not</text><text x="36" y="1450" class="s20">committed. TODAY: the gateway counter last_op_ makes the op number and no log exists. FUTURE: the log position is the op number.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.066386;0.077285;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 5 (A4): R0 sends PREPARE to both backups</text><text x="1432" y="38" class="e s24">step 5 of 70</text><text x="36" y="1424" class="s20">R0 sends PREPARE to R1 and R2. v is the view-number, m is the request, n is the op-number, and k is the commit-number.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.077285;0.092148;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 6 (A5): Backups append and send PREPAREOK</text><text x="1432" y="38" class="e s24">step 6 of 70</text><text x="36" y="1424" class="s20">Each backup checks v = its view-number (0 = 0) and n = op-number + 1 (1 = 0 + 1). Both checks pass. Each backup appends log[1],</text><text x="36" y="1450" class="s20">sets op-number 1, and sends PREPAREOK to R0.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.092148;0.10668;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 7 (A6): R0 commits op 1</text><text x="1432" y="38" class="e s24">step 7 of 70</text><text x="36" y="1424" class="s20">The PREPAREOK of R1 arrived first. f = 1 backups reached, so op 1 (and every earlier op) is committed. k goes from 0 to 1. The</text><text x="36" y="1450" class="s20">PREPAREOK of R2 arrived later and changes nothing.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.10668;0.123854;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 8 (A7): Up-call: Engine0.Apply(op 1)</text><text x="1432" y="38" class="e s24">step 8 of 70</text><text x="36" y="1424" class="s20">Checks: op 1 &gt; last_applied_op 0, and request 1 &gt; client table[alice] 0, so client table[alice] = 1. The order rests: ask 100: alice#1 qty</text><text x="36" y="1450" class="s20">10. last_applied_op = 1. The engine pushes Ack{client_order_id 1, symbol_id 1, exchange_order_id (gen 1, slot 99999), leaves 10}.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.123854;0.141359;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 9 (A8): The reply: Ack seq 2 reaches alice</text><text x="1432" y="38" class="e s24">step 9 of 70</text><text x="36" y="1424" class="s20">The Ack goes to the engine outbound queue. The R0 gateway adds seq 2 (LogonAck was seq 1) and writes it to the alice connection. This</text><text x="36" y="1450" class="s20">Ack is the VSR reply. R1 and R2 hold op 1 in the log, not committed, not applied.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.141359;0.154901;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 10 (B1): bob sends a buy order; R0 logs op 2</text><text x="1432" y="38" class="e s24">step 10 of 70</text><text x="36" y="1424" class="s20">bob sends NewOrder with request_number 1: buy 4 of symbol 1 at 100. The gateway validates it and routes symbol 1 to engine 0. R0</text><text x="36" y="1450" class="s20">sets n = 2 and appends log[2].</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.154901;0.168442;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 11 (B2): PREPARE carries the commit: k = 1</text><text x="1432" y="38" class="e s24">step 11 of 70</text><text x="36" y="1424" class="s20">R0 sends PREPARE with n = 2 and k = 1. The k field tells the backups that op 1 is committed. R0 needs no separate COMMIT message</text><text x="36" y="1450" class="s20">because new traffic flows.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.168442;0.18958;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 12 (B3): Backups append, learn k = 1, and apply op 1</text><text x="1432" y="38" class="e s24">step 12 of 70</text><text x="36" y="1424" class="s20">Each backup checks v and n = op-number + 1 (2 = 1 + 1) and appends log[2]. k = 1 says that op 1 is committed. Each backup calls</text><text x="36" y="1450" class="s20">Engine0.Apply(op 1) with the same checks and the same result as R0. It discards the report (the report sink is FUTURE). Then k = 1.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.18958;0.19825;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 13 (B3b): Backups send PREPAREOK for op 2</text><text x="1432" y="38" class="e s24">step 13 of 70</text><text x="36" y="1424" class="s20">Each backup sends PREPAREOK with n = 2 to R0.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.19825;0.219057;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 14 (B4): R0 commits op 2 and applies the fill</text><text x="1432" y="38" class="e s24">step 14 of 70</text><text x="36" y="1424" class="s20">One PREPAREOK (f = 1) commits op 2, so k = 2. Engine0.Apply(op 2): op 2 &gt; last_applied_op 1; request 1 &gt; client table[bob] 0, so client</text><text x="36" y="1450" class="s20">table[bob] = 1. The book fills 4 @ 100 against alice#1. The engine pushes three reports in this order: Fill (alice, maker), Fill (bob, taker),</text><text x="36" y="1476" class="s20">Ack (bob).</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.219057;0.23491;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 15 (B5): The gateway writes three reports to two sessions</text><text x="1432" y="38" class="e s24">step 15 of 70</text><text x="36" y="1424" class="s20">The gateway adds the seq of each session. alice gets Fill seq 3. bob gets Fill seq 2 and Ack seq 3. The reports of one request go to two</text><text x="36" y="1450" class="s20">sessions, but VSR has one reply for one client.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.23491;0.251755;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 16 (C1): alice sends a symbol 2 order; R0 logs op 3</text><text x="1432" y="38" class="e s24">step 16 of 70</text><text x="36" y="1424" class="s20">alice sends NewOrder with request_number 2: buy 3 of symbol 2 at 50. The gateway routes symbol 2 to engine 1, slot 0. R0 sets n = 3</text><text x="36" y="1450" class="s20">and appends log[3]. Engine 1 will see op 3, not ops 1 and 2.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.251755;0.261993;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 17 (C2): PREPARE for op 3 carries k = 2</text><text x="1432" y="38" class="e s24">step 17 of 70</text><text x="36" y="1424" class="s20">R0 sends PREPARE with n = 3 and k = 2. The k field carries the commit of the fill (op 2).</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.261993;0.277186;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 18 (C3): Backups append op 3 and apply the fill (op 2)</text><text x="1432" y="38" class="e s24">step 18 of 70</text><text x="36" y="1424" class="s20">Each backup appends log[3] and sets n = 3. k = 2 says that op 2 is committed. Each backup calls Engine0.Apply(op 2): the same fill as</text><text x="36" y="1450" class="s20">on R0, with the report discarded. Then k = 2.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.277186;0.285856;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 19 (C3b): Backups send PREPAREOK for op 3</text><text x="1432" y="38" class="e s24">step 19 of 70</text><text x="36" y="1424" class="s20">Each backup sends PREPAREOK with n = 3 to R0.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.285856;0.303361;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 20 (C4): R0 commits op 3 and applies it on engine 1</text><text x="1432" y="38" class="e s24">step 20 of 70</text><text x="36" y="1424" class="s20">k = 3. Engine1.Apply(op 3): op 3 &gt; last_applied_op(E1) 0 (a gap: ops 1 and 2 went to E0). Request 2 &gt; client table_E1[alice] 0, so it</text><text x="36" y="1450" class="s20">becomes 2 (a gap: request 1 went to E0). The order rests: bid 50: alice#2 qty 3.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.303361;0.316902;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 21 (C4b): Ack seq 4 reaches alice</text><text x="1432" y="38" class="e s24">step 21 of 70</text><text x="36" y="1424" class="s20">The engine pushes the Ack. The gateway adds seq 4 and writes it to alice. alice has now seen seq 2, 3, and 4 on her connection, in order,</text><text x="36" y="1450" class="s20">with no gap.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.316902;0.329453;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 22 (C5): Idle: COMMIT is also the heartbeat</text><text x="1432" y="38" class="e s24">step 22 of 70</text><text x="36" y="1424" class="s20">No new request arrives before the idle timer ends. R0 sends COMMIT with k = 3 to both backups. The same message tells the backups</text><text x="36" y="1450" class="s20">that R0 is alive.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.329453;0.341012;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 23 (C6): Backups apply op 3 on engine 1</text><text x="1432" y="38" class="e s24">step 23 of 70</text><text x="36" y="1424" class="s20">Each backup learns that op 3 is committed. It calls Engine1.Apply(op 3) and sets k = 3. Only engine 1 changes. A backup sends no reply.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.341012;0.353233;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 24 (C7): All replicas applied op 3: digests agree</text><text x="1432" y="38" class="e s24">step 24 of 70</text><text x="36" y="1424" class="s20">StateDigest(E0) and StateDigest(E1) are equal on R0, R1, and R2: the same state gives the same digest. The digest code exists today.</text><text x="36" y="1450" class="s20">Comparing digests between replicas is FUTURE.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.353233;0.361159;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 25 (D1): bob sends an order for an unknown symbol</text><text x="1432" y="38" class="e s24">step 25 of 70</text><text x="36" y="1424" class="s20">bob sends NewOrder with request_number 2 and symbol_id 42. The configuration has no symbol 42.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.361159;0.37338;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 26 (D1b): The gateway rejects; no op number is used</text><text x="1432" y="38" class="e s24">step 26 of 70</text><text x="36" y="1424" class="s20">The gateway sends Reject UnknownSymbol as bob seq 4. The request takes no op number, makes no log entry, and causes no PREPARE.</text><text x="36" y="1450" class="s20">No engine sees request 2.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.37338;0.382958;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 27 (D2): bob sends the first order again</text><text x="1432" y="38" class="e s24">step 27 of 70</text><text x="36" y="1424" class="s20">bob thinks that the reply to his first order was lost. He sends it again, unchanged: request_number 1, client_order_id 7.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.382958;0.396499;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 28 (D3): The gateway accepts; R0 logs op 4</text><text x="1432" y="38" class="e s24">step 28 of 70</text><text x="36" y="1424" class="s20">The gateway has no client table and no order state, so it accepts the order. R0 sets n = 4 and appends log[4]. The retry is a normal op in</text><text x="36" y="1450" class="s20">the log.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.396499;0.406655;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 29 (D3b): PREPARE for op 4</text><text x="1432" y="38" class="e s24">step 29 of 70</text><text x="36" y="1424" class="s20">R0 sends PREPARE with n = 4 and k = 3.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.406655;0.419536;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 30 (D3c): Backups append op 4 and send PREPAREOK</text><text x="1432" y="38" class="e s24">step 30 of 70</text><text x="36" y="1424" class="s20">Each backup checks v and n = op-number + 1 (4 = 3 + 1), appends log[4], and sends PREPAREOK. k = 3 is already applied, so nothing</text><text x="36" y="1450" class="s20">else changes.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.419536;0.438362;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 31 (D4): Engine0.Apply(op 4): a duplicate request</text><text x="1432" y="38" class="e s24">step 31 of 70</text><text x="36" y="1424" class="s20">One PREPAREOK commits op 4, so k = 4. Apply(op 4): op 4 &gt; last_applied_op 2, but request 1 ≤ client table[bob] 1, so the order is not</text><text x="36" y="1450" class="s20">executed. The book and the client table do not change. Without the request number this order would buy 4 more.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.438362;0.451243;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 32 (D4b): bob gets Reject DuplicateRequest</text><text x="1432" y="38" class="e s24">step 32 of 70</text><text x="36" y="1424" class="s20">The engine pushes Reject with reason DuplicateRequest; bob gets it as seq 5. The paper primary would resend the stored reply. mex</text><text x="36" y="1450" class="s20">decides in the engine and stores no reply.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.451243;0.45983;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 33 (E1): alice sends Cancel; R0 logs op 5</text><text x="1432" y="38" class="e s24">step 33 of 70</text><text x="36" y="1424" class="s20">alice sends Cancel with request_number 3 for client_order_id 1. R0 sets n = 5 and appends log[5].</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.45983;0.47139;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 34 (E1b): R0 sends PREPARE; the message to R2 is lost</text><text x="1432" y="38" class="e s24">step 34 of 70</text><text x="36" y="1424" class="s20">R0 sends PREPARE with n = 5 and k = 4 to R1 and R2. The network loses the PREPARE to R2. R1 receives its PREPARE.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.47139;0.488894;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 35 (E2): R1 appends op 5 and applies op 4</text><text x="1432" y="38" class="e s24">step 35 of 70</text><text x="36" y="1424" class="s20">R1 checks v and n = op-number + 1 (5 = 4 + 1) and appends log[5]. k = 4 says that op 4 is committed. R1 calls Engine0.Apply(op 4): a</text><text x="36" y="1450" class="s20">duplicate reject, discarded, so last_applied_op = 4. R2 has not seen op 5.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.488894;0.505739;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 36 (E3): R0 crashes before it reads the PREPAREOK</text><text x="1432" y="38" class="e s24">step 36 of 70</text><text x="36" y="1424" class="s20">R1 sends PREPAREOK for op 5, but R0 crashes first. The message ends at a down replica. Op 5 is not committed and alice has no reply.</text><text x="36" y="1450" class="s20">R0 loses all state because mex has no journal. The client connections to R0 break.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.505739;0.51928;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 37 (F1): R2 times out and starts view 1</text><text x="1432" y="38" class="e s24">step 37 of 70</text><text x="36" y="1424" class="s20">R2 hears no PREPARE and no COMMIT from R0 before its timeout. It sets v from 0 to 1 and status view-change. It sends</text><text x="36" y="1450" class="s20">STARTVIEWCHANGE to all other replicas. R0 is down.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.51928;0.53084;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 38 (F2): R1 joins the view change</text><text x="1432" y="38" class="e s24">step 38 of 70</text><text x="36" y="1424" class="s20">R1 receives STARTVIEWCHANGE with v = 1 &gt; its view-number 0. It sets v = 1 and status view-change. It sends STARTVIEWCHANGE to all</text><text x="36" y="1450" class="s20">other replicas.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.53084;0.548344;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 39 (F3): R1 sends its own DOVIEWCHANGE to itself</text><text x="1432" y="38" class="e s24">step 39 of 70</text><text x="36" y="1424" class="s20">R1 has STARTVIEWCHANGE for v = 1 from f = 1 other replica (R2). The new primary is 1 mod 3 = R1, so R1 gives DOVIEWCHANGE to</text><text x="36" y="1450" class="s20">itself. l is its log, and v' = 0 is the last view with status normal.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.548344;0.558583;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 40 (F4): R2 sends DOVIEWCHANGE to the new primary</text><text x="1432" y="38" class="e s24">step 40 of 70</text><text x="36" y="1424" class="s20">R2 has STARTVIEWCHANGE from f = 1 other replica (R1). It sends DOVIEWCHANGE to the new primary R1. R2 has only log[1..4].</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.558583;0.57873;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 41 (F5): R1 has f + 1 = 2 DOVIEWCHANGE and starts view 1</text><text x="1432" y="38" class="e s24">step 41 of 70</text><text x="36" y="1424" class="s20">Largest v' is 0 in both, so the largest n wins: R1 takes its own log[1..5]. It sets n = 5, k = max(4, 3) = 4, and status normal. R1 is now</text><text x="36" y="1450" class="s20">PRIMARY and its gateway accepts clients. R1 sends STARTVIEW. R1 has no committed op that it did not execute.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.57873;0.598216;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 42 (F6): R2 takes the new log and sends PREPAREOK</text><text x="1432" y="38" class="e s24">step 42 of 70</text><text x="36" y="1424" class="s20">R2 replaces its log with l and gains op 5. It sets n = 5, v = 1, and status normal. Op 5 is not committed, so it sends PREPAREOK. Then it</text><text x="36" y="1450" class="s20">executes the committed op that it did not execute: Engine0.Apply(op 4), a duplicate reject, discarded. k = 4.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.598216;0.613409;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 43 (F7): R1 commits op 5 and applies the cancel</text><text x="1432" y="38" class="e s24">step 43 of 70</text><text x="36" y="1424" class="s20">The PREPAREOK gives f = 1, so op 5 is committed and k = 5. Engine0.Apply(op 5): request 3 &gt; client table[alice] 1, so it becomes 3. The</text><text x="36" y="1450" class="s20">cancel executes: alice#1 leaves the book. last_applied_op = 5.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.613409;0.634877;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 44 (F7b): The report has no connection to go to</text><text x="1432" y="38" class="e s24">step 44 of 70</text><text x="36" y="1424" class="s20">The engine pushes CancelAck. alice has no connection to R1, so the gateway drops the report (resend of reports: FUTURE). Op 5 survives</text><text x="36" y="1450" class="s20">because one backup had it in its log. An op that reached no backup would be gone. The retry of alice with the same request number</text><text x="36" y="1476" class="s20">would then execute for the first time.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.634877;0.655024;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 45 (G1): alice logs on at the gateway of R1</text><text x="1432" y="38" class="e s24">step 45 of 70</text><text x="36" y="1424" class="s20">The alice connection to R0 broke. She connects to the R1 gateway and sends Logon. The session, not the connection, owns the orders</text><text x="36" y="1450" class="s20">and the request numbers. How a client finds the new primary is not designed yet. In the paper the client sends to all replicas and only</text><text x="36" y="1476" class="s20">the primary answers.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.655024;0.665263;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 46 (G2): alice sends the cancel again; R1 logs op 6</text><text x="1432" y="38" class="e s24">step 46 of 70</text><text x="36" y="1424" class="s20">alice sends Cancel with request_number 3 again, unchanged. The gateway of R1 accepts it. R1 sets n = 6 and appends log[6].</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.665263;0.676823;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 47 (G2b): R1 sends PREPARE for op 6</text><text x="1432" y="38" class="e s24">step 47 of 70</text><text x="36" y="1424" class="s20">R1 sends PREPARE with n = 6 and k = 5. R0 is down, so that message ends at a down replica. R2 receives its PREPARE.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.676823;0.692016;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 48 (G3): R2 applies op 5 and sends PREPAREOK for op 6</text><text x="1432" y="38" class="e s24">step 48 of 70</text><text x="36" y="1424" class="s20">R2 appends log[6] and sets n = 6. k = 5 says that op 5 is committed. R2 calls Engine0.Apply(op 5): the cancel executes, the report is</text><text x="36" y="1450" class="s20">discarded, and client table[alice] = 3. Then R2 sends PREPAREOK.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.692016;0.70952;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 49 (G4): Engine0.Apply(op 6): the retry is a duplicate</text><text x="1432" y="38" class="e s24">step 49 of 70</text><text x="36" y="1424" class="s20">One PREPAREOK commits op 6, so k = 6. Apply(op 6): request 3 ≤ client table[alice] 3, so it is not executed. The engine pushes</text><text x="36" y="1450" class="s20">CancelReject with reason DuplicateRequest; alice gets it as seq 2. alice now knows that request 3 was applied before.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.70952;0.725704;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 50 (G5): Idle: COMMIT tells R2 about op 6</text><text x="1432" y="38" class="e s24">step 50 of 70</text><text x="36" y="1424" class="s20">R1 is idle. It sends COMMIT with k = 6 to the other replicas. R0 is down, so that message ends at a down replica. R2 calls</text><text x="36" y="1450" class="s20">Engine0.Apply(op 6): a duplicate reject, discarded. k = 6 and last_applied_op = 6.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.725704;0.738915;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 51 (H1): R0 restarts and sends RECOVERY</text><text x="1432" y="38" class="e s24">step 51 of 70</text><text x="36" y="1424" class="s20">R0 restarts with empty state: status recovering, view-number unknown, empty log. It takes no part in requests or view changes. It sends</text><text x="36" y="1450" class="s20">RECOVERY with a nonce x to R1 and R2.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.738915;0.749484;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 52 (H2): R1 and R2 answer with RECOVERYRESPONSE</text><text x="1432" y="38" class="e s24">step 52 of 70</text><text x="36" y="1424" class="s20">Both replicas have status normal, so both answer. Only the primary R1 fills l, n, and k. R2 sends nil in those fields.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.749484;0.76798;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 53 (H3): R0 takes the state of the primary</text><text x="1432" y="38" class="e s24">step 53 of 70</text><text x="36" y="1424" class="s20">R0 has f + 1 = 2 answers with its nonce, and one comes from the primary of the latest view (R1, v = 1). It sets v = 1, log = l, n = 6, k =</text><text x="36" y="1450" class="s20">6, and status normal. R0 is now a BACKUP.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.76798;0.788126;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 54 (H4): R0 replays the log into its engines</text><text x="1432" y="38" class="e s24">step 54 of 70</text><text x="36" y="1424" class="s20">R0 builds its engine state again: Apply(op 1) to Apply(op 6) in order, each on its engine (ops 1, 2, 4, 5, 6 on E0; op 3 on E1). Reports are</text><text x="36" y="1450" class="s20">discarded. With a snapshot, R0 would load it, check its StateDigest, and apply only the later ops. Snapshot and restore: FUTURE.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.788126;0.797044;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 55 (H5): R0 digests equal the digests of R1 and R2</text><text x="1432" y="38" class="e s24">step 55 of 70</text><text x="36" y="1424" class="s20">StateDigest(E0) and StateDigest(E1) on R0 equal the values on R1 and R2. R0 has the same state again.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.797044;0.806127;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 56 (I1): bob logs on at the gateway of R1</text><text x="1432" y="38" class="e s24">step 56 of 70</text><text x="36" y="1424" class="s20">bob connects to the R1 gateway and sends Logon. R1 answers with LogonAck seq 1.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.806127;0.819668;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 57 (I1b): bob sends a sell order; R1 logs op 7</text><text x="1432" y="38" class="e s24">step 57 of 70</text><text x="36" y="1424" class="s20">bob sends NewOrder with request_number 3: sell 2 of symbol 2 at 60. Request 2 was a gateway reject, so no engine saw it. R1 sets n = 7</text><text x="36" y="1450" class="s20">and appends log[7].</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.819668;0.830567;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 58 (I1c): R1 sends PREPARE for op 7; the message to R0 is lost</text><text x="1432" y="38" class="e s24">step 58 of 70</text><text x="36" y="1424" class="s20">R1 sends PREPARE with n = 7 and k = 6 to R0 and R2. R2 receives it. The PREPARE to R0 is lost.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.830567;0.839815;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 59 (I2): R2 appends op 7 and sends PREPAREOK</text><text x="1432" y="38" class="e s24">step 59 of 70</text><text x="36" y="1424" class="s20">R2 checks v and n = op-number + 1 (7 = 6 + 1), appends log[7], and sends PREPAREOK.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.839815;0.854678;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 60 (I2b): R1 commits op 7 and applies it on engine 1</text><text x="1432" y="38" class="e s24">step 60 of 70</text><text x="36" y="1424" class="s20">k = 7. Engine1.Apply(op 7): op 7 &gt; last_applied_op(E1) 3. Request 3 &gt; client table_E1[bob] 0, so it becomes 3. The order rests: ask 60:</text><text x="36" y="1450" class="s20">bob#9 qty 2. The Ack goes to bob as seq 2.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.854678;0.864586;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 61 (I3): alice sends a buy order; R1 logs op 8</text><text x="1432" y="38" class="e s24">step 61 of 70</text><text x="36" y="1424" class="s20">alice sends NewOrder with request_number 4: buy 1 of symbol 1 at 90. R1 sets n = 8 and appends log[8].</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.864586;0.873503;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 62 (I3b): R1 sends PREPARE for op 8</text><text x="1432" y="38" class="e s24">step 62 of 70</text><text x="36" y="1424" class="s20">R1 sends PREPARE with n = 8 and k = 7 to R0 and R2. Both receive it.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.873503;0.884733;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 63 (I4): R2 applies op 7 and sends PREPAREOK for op 8</text><text x="1432" y="38" class="e s24">step 63 of 70</text><text x="36" y="1424" class="s20">R2 appends log[8] and sets n = 8. k = 7 says that op 7 is committed. R2 calls Engine1.Apply(op 7). Then R2 sends PREPAREOK.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.884733;0.90554;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 64 (I5): R1 commits op 8 and applies it on engine 0</text><text x="1432" y="38" class="e s24">step 64 of 70</text><text x="36" y="1424" class="s20">The PREPAREOK of R2 gives f = 1, so op 8 is committed and k = 8. R1 does not wait for R0. Engine0.Apply(op 8): request 4 &gt; client</text><text x="36" y="1450" class="s20">table_E0[alice] 3, so it becomes 4. The order rests: bid 90: alice#3 qty 1. last_applied_op(E0) = 8. The Ack goes to alice as seq 3.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.90554;0.923045;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 65 (I6): R0 sees a gap and sends GETSTATE</text><text x="1432" y="38" class="e s24">step 65 of 70</text><text x="36" y="1424" class="s20">R0 also received the PREPARE for op 8. It checks n = op-number + 1: 8 is not 6 + 1. R0 misses op 7, so it does not accept the PREPARE.</text><text x="36" y="1450" class="s20">It sends GETSTATE with its own op-number n' = 6 to R2.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.923045;0.934935;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 66 (I7): R2 answers with NEWSTATE</text><text x="1432" y="38" class="e s24">step 66 of 70</text><text x="36" y="1424" class="s20">R2 has status normal in the same view, so it answers with its log after n' = 6: log[7..8], with n = 8 and k = 7.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.934935;0.95244;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 67 (I8): R0 catches up and sends PREPAREOK</text><text x="1432" y="38" class="e s24">step 67 of 70</text><text x="36" y="1424" class="s20">R0 appends log[7] and log[8] and sets n = 8. k = 7 says that op 7 is committed, so R0 calls Engine1.Apply(op 7). Then R0 sends</text><text x="36" y="1450" class="s20">PREPAREOK for op 8. Op 8 is already committed at R1, so this message changes nothing there.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.95244;0.962018;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 68 (I9): Idle: COMMIT tells R0 and R2 about op 8</text><text x="1432" y="38" class="e s24">step 68 of 70</text><text x="36" y="1424" class="s20">R1 sends COMMIT with k = 8 to R0 and R2. Each calls Engine0.Apply(op 8) and sets k = 8.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.962018;0.982495;1" values="none;inline;none;none"/><text x="36" y="1388" class="b s22">Step 69 (J1): All three replicas hold the same log and state</text><text x="1432" y="38" class="e s24">step 69 of 70</text><text x="36" y="1424" class="s20">All replicas have v = 1, status normal, n = 8, and k = 8. R1 is the PRIMARY. E0: last_applied_op 8, client table {alice: 4, bob: 1}, bid 90:</text><text x="36" y="1450" class="s20">alice#3 qty 1. E1: last_applied_op 7, client table {alice: 2, bob: 3}, bid 50: alice#2 qty 3 and ask 60: bob#9 qty 2.</text></g><g display="none"><animate attributeName="display" calcMode="discrete" dur="605.55s" repeatCount="indefinite" keyTimes="0;0.982495;1" values="none;inline;inline"/><text x="36" y="1388" class="b s22">Step 70 (J2): Agreement check: the digests are equal</text><text x="1432" y="38" class="e s24">step 70 of 70</text><text x="36" y="1424" class="s20">StateDigest(E0) and StateDigest(E1) are equal on R0, R1, and R2: the replicas agree. A different digest at the same op number would</text><text x="36" y="1450" class="s20">show a determinism bug. FUTURE: write a snapshot at this op and cut the log before it. The loop then starts again.</text></g><rect x="16" y="1544" width="1424" height="262" rx="12" class="pn"/><text x="36" y="1574" class="b s20">Messages</text><rect x="36" y="1586" width="30" height="14" rx="4" class="sw k-request"/><text x="78" y="1598">NewOrder, Cancel, Logon</text><rect x="36" y="1610" width="30" height="14" rx="4" class="sw k-prepare"/><text x="78" y="1622">PREPARE</text><rect x="36" y="1634" width="30" height="14" rx="4" class="sw k-ok"/><text x="78" y="1646">PREPAREOK</text><rect x="36" y="1658" width="30" height="14" rx="4" class="sw k-commit"/><text x="78" y="1670">COMMIT (also the heartbeat)</text><rect x="36" y="1682" width="30" height="14" rx="4" class="sw k-viewchange"/><text x="78" y="1694">STARTVIEWCHANGE, DOVIEWCHANGE, STARTVIEW</text><rect x="36" y="1706" width="30" height="14" rx="4" class="sw k-recovery"/><text x="78" y="1718">RECOVERY, RECOVERYRESPONSE, GETSTATE,</text><text x="78" y="1739">NEWSTATE</text><rect x="36" y="1751" width="30" height="14" rx="4" class="sw k-report"/><text x="78" y="1763">reports: Ack, Fill, Reject, LogonAck</text><text x="600" y="1574" class="b s20">Log cells</text><rect x="600" y="1588" width="38" height="22" rx="5" class="ce"/><text x="652" y="1606">absent: not in the log</text><rect x="600" y="1616" width="38" height="22" rx="5" class="cu"/><text x="652" y="1634">appended, not committed</text><rect x="600" y="1644" width="38" height="22" rx="5" class="cc"/><text x="652" y="1662">committed, not applied</text><rect x="600" y="1672" width="38" height="22" rx="5" class="ca"/><text x="652" y="1690">applied by the engine</text><text x="600" y="1722" class="b s20">Step tags</text><rect x="600" y="1732" width="96" height="30" rx="7" class="chT"/><text x="648" y="1754" class="b c on">TODAY</text><text x="708" y="1754">code exists in the repository</text><rect x="600" y="1768" width="112" height="30" rx="7" class="chF"/><text x="656" y="1790" class="b c">FUTURE</text><text x="724" y="1790">needs the VSR library; not built</text><text x="1016" y="1574" class="b s20">Protocol</text><text x="1016" y="1600">f = 1, quorum = f + 1 = 2</text><text x="1016" y="1624">primary of view v = replica (v mod 3)</text><text x="1016" y="1648">v view-number, n op-number, k</text><text x="1016" y="1669">commit-number</text><text x="1016" y="1693">LA last_applied_op, CT client table</text><text x="1016" y="1717">q = qty in the book line</text><text x="1016" y="1741">Gold outline: just changed. Dashed: focus.</text><text x="24" y="1834" class="u">Protocol: Viewstamped Replication Revisited (Liskov and Cowling, 2012). mex is prepared for it; it does not replicate yet.</text></svg>

<script>
(function(){
var svg=document.querySelector('svg.vsr');
var T=605.55, ST=[0.0, 13.4, 20.8, 29.0, 40.2, 46.8, 55.8, 64.6, 75.0, 85.6, 93.8, 102.0, 114.8, 120.05, 132.65, 142.25, 152.45, 158.65, 167.85, 173.1, 183.7, 191.9, 199.5, 206.5, 213.9, 218.7, 226.1, 231.9, 240.1, 246.25, 254.05, 265.45, 273.25, 278.45, 285.45, 296.05, 306.25, 314.45, 321.45, 332.05, 338.25, 350.45, 362.25, 371.45, 384.45, 396.65, 402.85, 409.85, 419.05, 429.65, 439.45, 447.45, 453.85, 465.05, 477.25, 482.65, 488.15, 496.35, 502.95, 508.55, 517.55, 523.55, 528.95, 535.75, 548.35, 558.95, 566.15, 576.75, 582.55, 594.95], DU=[13.4, 7.4, 8.2, 11.2, 6.6, 9.0, 8.8, 10.4, 10.6, 8.2, 8.2, 12.8, 5.25, 12.6, 9.6, 10.2, 6.2, 9.2, 5.25, 10.6, 8.2, 7.6, 7.0, 7.4, 4.8, 7.4, 5.8, 8.2, 6.15, 7.8, 11.4, 7.8, 5.2, 7.0, 10.6, 10.2, 8.2, 7.0, 10.6, 6.2, 12.2, 11.8, 9.2, 13.0, 12.2, 6.2, 7.0, 9.2, 10.6, 9.8, 8.0, 6.4, 11.2, 12.2, 5.4, 5.5, 8.2, 6.6, 5.6, 9.0, 6.0, 5.4, 6.8, 12.6, 10.6, 7.2, 10.6, 5.8, 12.4, 10.6], SC=[{"id": "A", "name": "Normal operation: one order rests (op 1)", "t": 0.0}, {"id": "B", "name": "A fill: the commit travels in the next PREPARE (op 2)", "t": 85.6}, {"id": "C", "name": "The second engine, gaps, and the COMMIT heartbeat (op 3)", "t": 142.25}, {"id": "D", "name": "A gateway reject outside the log, and a duplicate request (op 4)", "t": 213.9}, {"id": "E", "name": "The primary fails with an uncommitted op (op 5)", "t": 273.25}, {"id": "F", "name": "View change 0 to 1", "t": 306.25}, {"id": "G", "name": "The client moves to the new primary and retries (op 6)", "t": 384.45}, {"id": "H", "name": "Recovery of R0", "t": 439.45}, {"id": "I", "name": "State transfer for a backup that missed a PREPARE (ops 7 and 8)", "t": 482.65}, {"id": "J", "name": "Agreement check", "t": 582.55}];

function now(){return playing?norm(svg.getCurrentTime()):pt}
function idx(t){var k=0;for(var j=0;j<ST.length;j++){if(ST[j]<=t+1e-6)k=j;else break}return k}

  if(p.step!==undefined){var n=parseInt(p.step,10);if(n>=1&&n<=ST.length){setPlay(false);
    seek(ST[n-1]+(p.f?parseFloat(p.f)*DU[n-1]:0));return true}}
  return false}
window.addEventListener('hashchange',hash);
window.addEventListener('load',function(){requestAnimationFrame(function(){if(!playing)svg.setCurrentTime(pt)})});
function loop(){if(playing)upd(now());requestAnimationFrame(loop)}
if(!hash())upd(0);
requestAnimationFrame(loop);
})();
</script></body></html>
